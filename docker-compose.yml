services:
  frontend:
    build:
      context: ./campuslend-front
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campuslend

  backend:
    build:
      context: ./campuslend-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/campuslend
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - campuslend

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: campuslend
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campuslend

volumes:
  mongo-data:

networks:
  campuslend:
